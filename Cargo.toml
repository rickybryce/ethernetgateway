[package]
name = "ethernetgateway"
version = "1.0.0"
edition = "2024"
authors = ["Ricky Bryce"]
license = "GPL-3.0-or-later"
description = "Telnet/SSH gateway and Hayes AT modem emulator for retro terminals — PETSCII, ANSI, and ASCII. Bridges Commodore 64, CP/M, and similar machines to modern networks with XMODEM/XMODEM-1K/YMODEM/ZMODEM file transfer, a web browser, AI chat, weather, SSH and telnet gateways."
repository = "https://github.com/rickybryce/ethernetgateway"
homepage = "https://github.com/rickybryce/ethernetgateway"
readme = "README.md"
keywords = ["telnet", "ssh", "zmodem", "xmodem", "retrocomputing"]
categories = ["command-line-utilities", "network-programming", "emulators"]
# The floor is set by the DEPENDENCIES, not by our own source.
#
# Our code needs 1.88: let-chains (`if let Some(x) = e && cond`) were stabilised
# there for edition 2024 and are used in ~96 places.  But egui/eframe 0.34
# require 1.92, so 1.92 is what actually builds this repo and 1.88 would fail at
# dependency resolution — a promise the build cannot keep, which is the same
# defect as the 1.87 it replaced, only later in the process.  Both were found by
# the `msrv` CI job rather than by reading, because every other job installs
# @stable and can never see this; keep that job's pin equal to this value.
rust-version = "1.92"
# Exclude build artifacts and dev-only files from the published crate.
exclude = [
    "/target",
    "/proptest-regressions",
    "/.github",
    "/web",
    "*.AppImage",
    "egateway.conf",
    "CLAUDE.md",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
signal-hook = "0.4"
libc = "0.2"
# PBKDF2-HMAC-SHA256 for the operator password in egateway.conf (see
# src/credential.rs).  Already in the tree via russh (bcrypt-pbkdf -> ssh-key)
# and pkcs5, so this adds **no new crate** -- it makes a transitive dependency
# a direct one.  The features do add edges: `phc` pulls password-hash and
# `sha2` the hash itself, both of which were already being built for other
# dependents, so nothing new is compiled from scratch either.
#
# Chosen over Argon2id, which is also already present, because Argon2's
# memory-hardness is the wrong trade for this device class: its recommended
# parameters ask for 19 MiB *per concurrent verification*, and this gateway
# runs on Raspberry Pis with `max_sessions` defaulting to 50, so a burst of
# telnet logins could ask for most of a Pi's RAM.  PBKDF2 costs kilobytes and
# is on the OpenSSF criterion's approved list, so the trade buys back the
# memory without weakening the claim.
pbkdf2 = { version = "0.13", features = ["phc", "getrandom", "sha2"] }
# Local-time stamps on every log line (src/logger.rs `stamp`).  A security log
# that cannot say WHEN is half a log: the 2026-09-13 survey of an exposed
# gateway could not tell a burst of connections from a slow drip, which is
# exactly the fact needed to size `conn_rate_max`.
#
# `default-features = false` deliberately: the default set drags in `wasmbind`
# (js-sys + wasm-bindgen) and `serde`, none of which this uses.  `clock` is the
# feature that provides `Local::now`, and it is the whole reason for the crate
# -- std can format no local time on any platform, and the `libc::localtime_r`
# route would have covered Linux while leaving the Windows deployments (where
# this gateway is actually exposed) on UTC.  It adds `iana-time-zone`.
#
# NOTE: chrono was already present in Cargo.lock but NOT in the build graph
# (`cargo tree` named it nowhere), so unlike `pbkdf2` this is a genuinely new
# compiled dependency and must be reflected in THIRD-PARTY-NOTICES at the next
# release cut.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
russh = "0.63"
ureq = "3"
serde_json = "1"
html2text = "0.14"
# Pinned to html2text 0.14's OWN html5ever, and it must stay that way.
#
# We parse the DOM ourselves rather than through `Config::parse_html` for one
# reason: that helper hardcodes `TreeBuilderOpts::default()`, which leaves
# `scripting_enabled` true, and html5ever then parses <noscript> content as raw
# TEXT.  We do not run JavaScript, so <noscript> content is exactly the content
# meant for us -- with the default it renders as visible tag soup and anything
# inside it (a meta refresh, a fallback link) is invisible to a DOM walk.
#
# The version must match html2text's transitively so cargo unifies them into
# ONE crate instance: our `RcDom` comes from html2text's re-export, and if the
# two html5ever versions diverged, that `RcDom` would implement a different
# crate's `TreeSink` and stop compiling.  `cargo tree -d html5ever` must show a
# single entry -- if a html2text bump moves this, follow it here in the same
# commit.
html5ever = "0.40"
url = "2"
serialport = "4"
bytes = "1"
rand = "0.10"
if-addrs = "0.15"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui_extras = { version = "0.35", features = ["image"] }
arboard = { version = "3", default-features = false }
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
iz80 = "0.5.1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["test-util"] }
# An INDEPENDENT SHA-256, for tests that need one rather than for hashing:
# it pins the checked-in EGT8080.COM/EGT80.COM against explicit hashes
# (`test_bundled_terminals_match_pinned_hashes`), the measured Altair blank
# and extraction against the guest's own output, and -- the one that matters
# most -- our hand-rolled production hasher against a second implementation
# (`test_sha256_agrees_with_an_independent_implementation`).  `fetch::sha256`
# verifies every disk and ROM the product downloads, so its oracle must not
# be itself.
#
# Costs nothing: BOTH 0.10 and 0.11 are already in the tree under russh
# (0.10 via russh/bcrypt-pbkdf/ssh-encoding, 0.11 via its forked ssh-key,
# ed25519-dalek, rsa and the p256/384/521 crates), so this tracks a copy that
# is built regardless.  Do not reach for it in non-test code -- a second
# hasher in the binary is how the two disagree about a download.
sha2 = "0.11"

[profile.release]
# Integer overflow panics in the dev profile, so the whole test suite validates
# wrapping-is-a-bug semantics — but cargo's release default turns the checks
# off, meaning the binary we actually ship has different arithmetic from the
# one we tested.  That matters here more than in most applications: the
# load-bearing code is five hand-rolled wire-protocol parsers doing offset,
# length and sequence arithmetic on bytes supplied by an untrusted peer, and
# there a silent wrap becomes a wrong length rather than a loud failure.
#
# The cost is a branch per arithmetic op, which is noise for an I/O-bound
# gateway, and a panic is confined to the tokio task handling that one session
# rather than taking the process down.
overflow-checks = true
