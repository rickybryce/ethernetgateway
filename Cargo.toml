[package]
name = "ethernetgateway"
version = "0.9.2"
edition = "2024"
authors = ["Ricky Bryce"]
license = "GPL-3.0-or-later"
description = "Telnet/SSH gateway and Hayes AT modem emulator for retro terminals — PETSCII, ANSI, and ASCII. Bridges Commodore 64, CP/M, and similar machines to modern networks with XMODEM/XMODEM-1K/YMODEM/ZMODEM file transfer, a web browser, AI chat, weather, SSH and telnet gateways."
repository = "https://github.com/rickybryce/ethernetgateway"
homepage = "https://github.com/rickybryce/ethernetgateway"
readme = "README.md"
keywords = ["telnet", "ssh", "zmodem", "xmodem", "retrocomputing"]
categories = ["command-line-utilities", "network-programming", "emulators"]
# 1.88 stabilised let-chains (`if let Some(x) = e && cond`) in edition 2024, and
# the crate uses them in ~96 places.  Declaring less is worse than useless: 1.87
# passes the `rust-version` check and then fails in the *parser*, so the operator
# gets a syntax error instead of cargo's "requires rustc 1.88".  CI builds on
# @stable and can never see this, so the `msrv` job pins this exact value.
rust-version = "1.88"
# Exclude build artifacts and dev-only files from the published crate.
exclude = [
    "/target",
    "/proptest-regressions",
    "/.github",
    "/web",
    "*.AppImage",
    "egateway.conf",
    "CLAUDE.md",
]

[dependencies]
tokio = { version = "1", features = ["full"] }
signal-hook = "0.3"
libc = "0.2"
russh = "0.60"
ureq = "3"
serde_json = "1"
html2text = "0.14"
url = "2"
serialport = "4"
bytes = "1"
rand = "0.10"
if-addrs = "0.15"
eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui_extras = { version = "0.34", features = ["image"] }
arboard = { version = "3", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
iz80 = "0.5.1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["test-util"] }
# Only used to pin the checked-in EGT80.COM against an explicit hash (see
# test_bundled_egt80_matches_pinned_hash).  Already in the tree via russh,
# so this adds nothing to the build.
sha2 = "0.10"

[profile.release]
# Integer overflow panics in the dev profile, so the whole test suite validates
# wrapping-is-a-bug semantics — but cargo's release default turns the checks
# off, meaning the binary we actually ship has different arithmetic from the
# one we tested.  That matters here more than in most applications: the
# load-bearing code is five hand-rolled wire-protocol parsers doing offset,
# length and sequence arithmetic on bytes supplied by an untrusted peer, and
# there a silent wrap becomes a wrong length rather than a loud failure.
#
# The cost is a branch per arithmetic op, which is noise for an I/O-bound
# gateway, and a panic is confined to the tokio task handling that one session
# rather than taking the process down.
overflow-checks = true
