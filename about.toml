# cargo-about configuration — generates THIRD-PARTY-NOTICES.md.
#
# Regenerate after any dependency change with:
#   cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md
#
# This satisfies the attribution obligation carried by the permissive
# licenses (MIT / BSD / Apache-2.0 / ISC / Zlib / ...) in the
# dependency tree: their copyright notices and license text must be
# reproduced in the distribution.
#
# WHAT THIS DOES NOT COVER, and what to do about it.
#
# cargo-about walks the *Cargo dependency tree* and nothing else.  Code that
# arrives any other way — vendored, transcribed, or derived from a project we
# read — is invisible to it, and `THIRD-PARTY-NOTICES.md` says at the top not
# to edit it by hand, correctly: a regeneration would silently delete anything
# added there.  So a hand-added notice in that file is not a fix, it is a
# time bomb.
#
# Nothing in the tree needs this today.  Every emulated board here is
# clean-room from hardware documentation and from the guests' own drivers, the
# same posture as Punter, HBIOS and EGT80; the bundled `EGT80.COM` is ours; the
# test fixtures are our own captures; and no disk images are distributed.
#
# It stops being true the moment we ship code derived from another project.
# The live candidate is a controller for z80pack's `cpmsim` (Udo Munk, MIT):
# that hardware never existed, so the simulator's source is the only
# specification there is, and an implementation built from it is derived work
# whose copyright and permission notice must travel with our binary.  MIT into
# GPL-3.0-or-later is the compatible direction, so this is an attribution
# obligation and not a licensing obstacle.
#
# When that lands, add a STATIC section to `about.hbs` — "Non-crate
# components" — carrying the notice verbatim.  Putting it in the template is
# what makes it survive `cargo about generate`.

# Accept a license fulfilled on any target — we ship cross-platform
# (Linux/macOS/Windows), so per-target dependencies (winapi, objc2,
# wayland, ...) should all be included in the notices.
accepted = [
    "GPL-3.0-or-later",
    # `GPL-3.0` is intentionally retained here (unlike deny.toml, which
    # dropped it): a dual-licensed dep offered as `GPL-3.0 OR MIT` (e.g.
    # `unescaper`) is then attributed under GPL-3.0 in the notices — the
    # natural choice inside this GPL-3.0-or-later work.  deny.toml only needs
    # to *permit* the crate, which MIT already does, so the two configs
    # legitimately differ.  Drop this line to attribute such deps under MIT.
    "GPL-3.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
]

# Include license info for all targets so the notices file is complete
# regardless of which platform generated it.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
]

# Our own crate is the workspace root; don't list it as a third party.
workarounds = []
