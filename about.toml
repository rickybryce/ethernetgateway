# cargo-about configuration — generates THIRD-PARTY-NOTICES.md.
#
# Regenerate after any dependency change with:
#   cargo about generate about.hbs -o THIRD-PARTY-NOTICES.md
#
# This satisfies the attribution obligation carried by the permissive
# licenses (MIT / BSD / Apache-2.0 / ISC / Zlib / ...) in the
# dependency tree: their copyright notices and license text must be
# reproduced in the distribution.
#
# WHAT THIS DOES NOT COVER, and what to do about it.
#
# cargo-about walks the *Cargo dependency tree* and nothing else.  Code that
# arrives any other way — vendored, transcribed, or derived from a project we
# read — is invisible to it, and `THIRD-PARTY-NOTICES.md` says at the top not
# to edit it by hand, correctly: a regeneration would silently delete anything
# added there.  So a hand-added notice in that file is not a fix, it is a
# time bomb.
#
# There is exactly one such component today, and it IS handled: `src/cpm/
# z80pack.rs` is derived from z80pack's `cpmsim` source (Udo Munk, MIT) rather
# than written clean-room, because that device is a simulator's invented
# interface and its source is the only specification that exists.  MIT into
# GPL-3.0-or-later is the compatible direction, so it is an attribution
# obligation and not a licensing obstacle.
#
# Its notice lives in a STATIC "Non-crate components" section of `about.hbs`.
# That placement is the whole trick: putting it in the template is what makes it
# survive `cargo about generate`.  Add any future one there too, and never to
# the generated file.
#
# Everything else remains clean-room from hardware documentation and the guests'
# own drivers — the same posture as Punter, HBIOS and EGT8080.  The bundled
# `EGT8080.COM` is ours, the test fixtures are our own captures, and no disk
# images are distributed.

# Accept a license fulfilled on any target — we ship cross-platform
# (Linux/macOS/Windows), so per-target dependencies (winapi, objc2,
# wayland, ...) should all be included in the notices.
accepted = [
    "GPL-3.0-or-later",
    # `GPL-3.0` is deliberately NOT accepted here, matching deny.toml.  It used
    # to be, so that a dual-licensed dep offered as `GPL-3.0 OR MIT` (today
    # only `unescaper`, reached through `serialport`) was attributed under
    # GPL-3.0 as the seemingly natural choice inside a GPL-3.0-or-later work.
    # It is the wrong arm to elect: `GPL-3.0` is GPL-3.0-*only*, so taking that
    # component on those terms pins the whole combined work to v3 and quietly
    # spends the "or later" this project grants.  Electing MIT costs nothing —
    # the dep offers it — and keeps the grant intact.  cargo-about picks the
    # first accepted license of an `OR` expression, so the fix is to leave this
    # list without a copyleft arm that a permissive one could satisfy.
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
    "LGPL-2.1-or-later",
]

# Include license info for all targets so the notices file is complete
# regardless of which platform generated it.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
]

# Our own crate is the workspace root; don't list it as a third party.
workarounds = []
