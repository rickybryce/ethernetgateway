# Dependabot keeps two things current that nothing else here watches.
#
# `cargo` matters because nothing else here moves a version: the `audit` job
# REPORTS a vulnerable lockfile and cannot fix one, so before this file the
# only thing that bumped a dependency was somebody deciding to.
#
# **These are version updates, not security updates, and the difference is the
# whole point.**  This file schedules hygiene bumps.  Reacting to a *published
# advisory* -- a PR that ignores `open-pull-requests-limit`, and a
# notification -- is Dependabot alerts + security updates, which is a
# repository setting and not configurable from here.  It was off when this file
# was added, so for a while the rationale written here described protection
# that did not exist.  If a rewrite of this comment ever claims otherwise,
# check the repo setting before believing it.
#
# (First draft of this comment cited RUSTSEC-2026-0221 as a live advisory the
# `audit` job had missed.  Wrong: it patches at `event-listener` >= 5.4.2 and
# the lockfile was already there, so the green `audit` job was correct.  A
# motivating example nobody re-checks is how a false claim survives inside an
# otherwise sound rationale.)
#
# `github-actions` matters because the workflows pin action SHAs rather than
# tags -- a pin is a supply-chain control and a maintenance burden at the same
# time, and this is what carries the burden.  Without it the pins rot.
#
# Grouped so a week's updates arrive as one PR to review rather than a dozen:
# with a single maintainer, review attention is the scarce resource, and a
# flood of separate PRs is how bumps stop being read.
#
# `target-branch: dev` because everything reaches `master` through `dev` and
# the Pis; a bump PR against `master` could only be copied onto `dev` by hand.
# Two things this does NOT do: Dependabot reads this file from the default
# branch, so an edit here takes effect only once it is merged to `master`;
# and security-update PRs ignore `target-branch` and still go to `master`.
# ci.yml lists `dev` under `pull_request` so these PRs get the full CI run.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
