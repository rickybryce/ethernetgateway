name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Allow manual triggering (e.g. to re-run for a tag that already exists).
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.3)"
        required: true

env:
  CARGO_TERM_COLOR: always

# Least privilege by default.  Scorecard's Token-Permissions check reads the
# absence of this block as "every job gets the runner's default token", which
# on a public repo is read-only for contents but wider than any job here
# needs.  A job that needs more declares it and OVERRIDES this wholesale --
# `audit` needs `checks: write` for the advisory Check Run and says so, and
# release.yml's publish job needs `contents: write` plus `id-token: write` for
# keyless sigstore signing.  Neither is affected by this line.
permissions:
  contents: read

jobs:
  # ─── Build binaries on each target platform ──────────────
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            appimage_arch: x86_64
          # Native arm64 Linux runner — produces the Raspberry Pi 4+ build.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            appimage_arch: aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libfontconfig1-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build --release
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          NAME="ethernetgateway-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp "target/${{ matrix.target }}/release/ethernetgateway" "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/" 2>/dev/null || true
          # The terminal is also compiled into the binary (it lands on CP/M
          # drive A: by itself), but ship the loose file too: it is what you
          # send to a real CP/M machine over XMODEM, and that should not
          # require starting the emulator to get at.
          #
          # BOTH builds, and this step is where getting that wrong has cost
          # something twice: v0.9.0 shipped only the Z80 build -- the terminal
          # the manual tells you *not* to start with -- because a version-bump
          # checklist cannot catch a file that should have been ADDED.
          #
          # EGT8080 is built to the 8080's instruction set, so it runs
          # whichever processor `cpm_cpu` selects and is the one to reach for.
          # EGT80 is the Z80 build, and it is not a spare: the Z180 ASCI ports
          # -- the console of an SC126 and of many a RomWBW board -- are
          # reached with ED-prefixed instructions that cannot appear in a
          # binary which must also run on a true 8080.  Ship one and a whole
          # class of machine has no terminal.
          cp EGT8080/EGT8080.COM "dist/${NAME}/" 2>/dev/null || true
          cp EGT8080/EGT80.COM   "dist/${NAME}/" 2>/dev/null || true
          tar -czf "dist/${NAME}.tar.gz" -C dist "${NAME}"
          echo "ARTIFACT=dist/${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "ethernetgateway-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\ethernetgateway.exe" "dist\$name\"
          if (Test-Path "README.md") { Copy-Item "README.md" "dist\$name\" }
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE"   "dist\$name\" }
          # See the tar.gz step: both builds, shipped loose as well as
          # compiled in.  A file added to one branch of this step and not the
          # other is worse than one added to neither -- it ships on some
          # platforms only, which is a bug report nobody can reproduce.
          if (Test-Path "EGT8080\EGT8080.COM") { Copy-Item "EGT8080\EGT8080.COM" "dist\$name\" }
          if (Test-Path "EGT8080\EGT80.COM")   { Copy-Item "EGT8080\EGT80.COM"   "dist\$name\" }
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ARTIFACT=dist\$name.zip"

      # ─── AppImage (Linux only) ─────────────────────────────
      # Bundles the same release binary the tar.gz ships, so users who
      # prefer an integrated AppImage launcher don't need to reach for
      # the tar.gz + system-wide install.  Runs on each Linux build slot
      # (x86_64 and aarch64) because AppImage is a Linux-only container
      # format; the arch is taken from matrix.appimage_arch.
      - name: Build AppImage
        if: matrix.appimage_arch != ''
        shell: bash
        run: |
          set -euo pipefail
          ARCH="${{ matrix.appimage_arch }}"
          # appimagetool is a self-contained AppImage; GitHub runners
          # lack FUSE, so extract it and invoke AppRun directly.  Each
          # arch has its own appimagetool build with a matching runtime.
          #
          # **Verified by hash, because this URL is mutable and this binary
          # packages our release.**  It is fetched and executed inside the job
          # that builds the artifacts users download, so whatever sits behind
          # the URL gets to touch them.  `continuous` is a rolling prerelease:
          # it was published 2023-03-08 and its assets were last replaced
          # 2025-07-26, so "the version we tested with" and "the version we
          # get" are not the same statement.  Pinning to the last numbered
          # release is not an option -- upstream renamed tag 13's copies
          # `obsolete-appimagetool-*`, so there is no supported immutable URL.
          #
          # The hashes below are the bytes that built v1.0.0-RC1, measured
          # from the live URL.  **If upstream republishes `continuous`, a
          # release cut will stop here with a checksum mismatch.**  That is the
          # intended direction -- refusing to run unrecognised code beats
          # silently packaging with it -- but it is a failure a release can
          # hit, so: verify the new binary is genuinely upstream's, then
          # update the hash here in its own commit, never as part of a release.
          case "$ARCH" in
            x86_64)  APPIMAGETOOL_SHA256=b90f4a8b18967545fda78a445b27680a1642f1ef9488ced28b65398f2be7add2 ;;
            aarch64) APPIMAGETOOL_SHA256=a48972e5ae91c944c5a7c80214e7e0a42dd6aa3ae979d8756203512a74ff574d ;;
            *) echo "no recorded appimagetool hash for arch ${ARCH}" >&2; exit 1 ;;
          esac
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-${ARCH}.AppImage" -O appimagetool
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c - || {
              echo "FATAL: appimagetool for ${ARCH} does not match the recorded hash." >&2
              echo "  expected ${APPIMAGETOOL_SHA256}" >&2
              echo "  got      $(sha256sum appimagetool | cut -d' ' -f1)" >&2
              exit 1
          }
          chmod +x appimagetool
          ./appimagetool --appimage-extract >/dev/null
          mkdir -p AppDir/usr/bin
          cp target/${{ matrix.target }}/release/ethernetgateway AppDir/usr/bin/
          cp web/ethernetgatewaylogo.png AppDir/ethernetgateway.png
          cat > AppDir/ethernetgateway.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Ethernet Gateway
          Comment=Telnet/SSH gateway and Hayes AT modem emulator for retro terminals
          Exec=ethernetgateway
          Icon=ethernetgateway
          Categories=Network;Utility;
          Terminal=false
          EOF
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          # Everything the gateway creates lives in `ethernetgateway-data`
          # BELOW THE WORKING DIRECTORY, and a desktop launch does not define
          # one: the desktop-entry spec leaves it undefined when `Path=` is
          # absent (and `Path=` takes a literal, so it cannot say "$HOME").
          # Left alone, the same AppImage double-clicked from a file manager and
          # started from an application menu can land on two different data
          # directories -- two configs, two SSH host keys, two transfer trees,
          # and two per-directory locks that know nothing about each other.
          #
          # So pin it, but only when there is no shell behind us: a launch from
          # a terminal names its own working directory deliberately (the repo's
          # own harnesses do exactly that) and must keep it.
          #
          # And never move away from a data directory that is already here. The
          # tty test alone was too blunt: `nohup ./Ethernet_Gateway.AppImage
          # >log 2>&1 &` from /srv/gateway has no terminal on any stream either,
          # and relocating a deliberate launch's data to $HOME would be exactly
          # the split this pin exists to prevent. An existing folder is the
          # operator's answer to the question, so it wins.
          if [ ! -t 0 ] && [ ! -t 1 ] && [ ! -t 2 ] \
             && [ ! -d ethernetgateway-data ] && [ -d "${HOME}" ]; then
            cd "${HOME}" || exit 1
          fi
          exec "${HERE}/usr/bin/ethernetgateway" "$@"
          EOF
          chmod +x AppDir/AppRun
          ARCH="${ARCH}" ./squashfs-root/AppRun AppDir "dist/Ethernet_Gateway-${ARCH}.AppImage"
          echo "APPIMAGE=dist/Ethernet_Gateway-${ARCH}.AppImage" >> "$GITHUB_ENV"

      - name: SHA-256 checksum
        shell: bash
        run: |
          sha() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" > "$1.sha256"
            else
              # macOS / Windows (git-bash): shasum is present on both.
              shasum -a 256 "$1" > "$1.sha256"
            fi
          }
          sha "${ARTIFACT}"
          if [ -n "${APPIMAGE:-}" ] && [ -f "${APPIMAGE}" ]; then
            sha "${APPIMAGE}"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  # ─── Sign and publish a GitHub Release ───────────────────
  release:
    name: sign & publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # needed for sigstore/cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # needed so CHANGELOG.md is present

      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      # ─── GPG sign (requires GPG_PRIVATE_KEY secret) ─────
      # If the secret is not configured, the step is skipped — the
      # release still publishes with SHA-256 checksums, just no .asc
      # files.  Set GPG_PRIVATE_KEY (ASCII-armored) in repo Settings →
      # Secrets → Actions to enable GPG signing.
      - name: Import GPG key
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GPG_AVAILABLE=1" >> "$GITHUB_ENV"

      - name: GPG-sign artifacts
        if: env.GPG_AVAILABLE == '1'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd dist
          for f in ethernetgateway-*.tar.gz ethernetgateway-*.zip Ethernet_Gateway-*.AppImage; do
            [ -f "$f" ] || continue
            if [ -n "${GPG_PASSPHRASE}" ]; then
              echo "${GPG_PASSPHRASE}" | gpg --batch --yes --pinentry-mode loopback \
                --passphrase-fd 0 --armor --detach-sign "$f"
            else
              gpg --batch --yes --armor --detach-sign "$f"
            fi
          done
          ls -la

      # ─── Sigstore keyless signing (always runs, no secrets needed) ─
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # **One Sigstore bundle per artifact, `<name>.sigstore.json`.**  The
      # signature, the Fulcio certificate and the Rekor inclusion proof travel
      # in one file instead of the `.sig` + `.pem` pair this project published
      # up to 1.0.0-RC2.
      #
      # The pair is gone because cosign is retiring the flags that produce it.
      # Measured against the real binaries rather than the release notes:
      # `--output-signature` and `--output-certificate` are already DEPRECATED
      # in v3.0.6 -- the version `cosign-installer@v4.1.2` installs today, and
      # they are not even listed in `sign-blob --help` any more -- and in
      # v3.1.3 `--new-bundle-format` is deprecated too, saying in as many
      # words: "this will be the only supported format in future versions".
      # So `--new-bundle-format=false`, the escape hatch added when RC2's cut
      # died here, is itself on the way out.  `verify-blob --signature` and
      # `--certificate` carry the same warning, so the pair was becoming
      # awkward to *check* as well as to produce.
      #
      # That mattered more than usual because nothing runs this workflow but a
      # tag push (see versionchange.txt): the change that broke RC2 was an
      # automated pin bump, and the next one could land a cosign where the
      # flags are removed rather than deprecated.  Deprecated-but-working is a
      # window, not a state.
      #
      # No flags now beyond `--bundle` itself: cosign 3 defaults
      # `--new-bundle-format` and `--use-signing-config` to true, and both want
      # exactly the `--bundle` this passes, so the command is the tool's own
      # default path.  Verified against v3.0.6 and v3.1.3 before committing --
      # both reach the OIDC step with no deprecation warning and no validation
      # refusal, where the previous one-flag attempt was rejected outright.
      #
      # **Verifying needs cosign v2.5 or newer** (or any v3).  Measured, not
      # assumed: v2.5.0 and v2.6.5 both read this bundle, v2.4.0 and v2.2.4
      # refuse it with "payload must be a valid DSSE envelope".  cosign 2 is
      # still maintained -- v2.6.5 shipped the same day as v3.1.3 -- so a
      # verifier is not forced onto 3 by this change.
      - name: Sigstore-sign artifacts
        run: |
          cd dist
          for f in ethernetgateway-*.tar.gz ethernetgateway-*.zip Ethernet_Gateway-*.AppImage; do
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
          ls -la

      # ─── Publish the GitHub Release ─────────────────────
      - name: Extract changelog section for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          VERSION="${TAG#v}"
          # Pull the `## [VERSION]` block out of CHANGELOG.md, stopping at
          # the next `## ` heading.  Empty string if not found.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { capture=1; next }
              capture && /^## / { exit }
              capture { print }
            ' CHANGELOG.md > release_notes.md
          fi
          if [ ! -s release_notes.md ]; then
            echo "Release ${TAG}." > release_notes.md
          fi
          echo "notes_path=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag }}
          name: "ethernetgateway ${{ github.ref_name || github.event.inputs.tag }}"
          body_path: ${{ steps.changelog.outputs.notes_path }}
          draft: false
          prerelease: false
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.AppImage
            dist/*.sha256
            dist/*.asc
            dist/*.sigstore.json
          fail_on_unmatched_files: false
