name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # **Weekly, because two of these jobs answer questions that change while
  # nobody pushes.**  Every trigger above needs somebody to do something, so a
  # quiet fortnight means nothing here has been asked.  Two jobs go stale that
  # way and both have cost a release already:
  #
  #   * `audit` reads an advisory database that is updated continuously, and a
  #     new advisory against a dependency we already have is exactly the case
  #     no push will reveal.  (Dependabot security updates now cover the same
  #     ground from the other side -- see .github/dependabot.yml on why those
  #     are a repository setting and not in that file.  Two independent
  #     detectors is deliberate: one is ours and one is GitHub's.)
  #   * every job installs `@stable` and the repo pins no toolchain, so a new
  #     rustc arrives here before it arrives locally.  This has happened for
  #     real: 1.98 added `chunks_exact_to_as_chunks` and `needless_late_init`
  #     fired twice more, six errors a clean local 1.97.1 could not see, and
  #     they failed the macOS *and* Windows jobs on a release cut.  Finding
  #     that on a Wednesday is a chore; finding it while cutting a release is
  #     the release.
  #
  # Offset from codeql.yml's Monday 04:27 rather than sharing it, so a red X
  # names one workflow.
  schedule:
    - cron: '17 5 * * 3'
  # Allow manual triggering from the Actions tab.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Least privilege by default.  Scorecard's Token-Permissions check reads the
# absence of this block as "every job gets the runner's default token", which
# on a public repo is read-only for contents but wider than any job here
# needs.  A job that needs more declares it and OVERRIDES this wholesale --
# `audit` needs `checks: write` for the advisory Check Run and says so, and
# release.yml's publish job needs `contents: write` plus `id-token: write` for
# keyless sigstore signing.  Neither is affected by this line.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libfontconfig1-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build
        run: cargo build --verbose

      - name: cargo clippy (all targets, warnings = errors)
        run: cargo clippy --all-targets --verbose

      - name: cargo test
        run: cargo test --verbose

      # Run the proptest fuzzers with an elevated case count on Linux.
      # Keeps CI fast on the other platforms while still getting
      # cross-platform coverage of the deterministic unit tests.
      #
      # The filter is the bare word "proptest", which cargo matches against the
      # full test path: it catches the *_proptest modules (qmethod, punter,
      # ymodem_parser, zmodem) and kermit's proptest_*_no_panic fns alike, i.e.
      # every hand-rolled wire parser that reads untrusted bytes.  It used to
      # read "qmethod_proptest", which reached only the telnet option-
      # negotiation state machine — 3 of the 20 property tests.
      #
      # Note this only bites because no proptest! block sets `cases:` as a
      # struct-literal field any more; such a field silently overrides
      # PROPTEST_CASES, which is read by ProptestConfig::default().
      - name: cargo test (extended proptest cases)
        if: matrix.os == 'ubuntu-latest'
        env:
          PROPTEST_CASES: "4096"
        run: cargo test proptest --verbose

  # ─── The declared MSRV actually compiles ──────────────────────────────
  #
  # Every other job installs @stable, so nothing in the pipeline ever built at
  # the minimum this project *promises*.  That is how `rust-version` sat at 1.87
  # while the crate used let-chains, stabilised in 1.88: the declared floor was a
  # version the code could not be compiled by, and the only person who found out
  # was somebody following the README.
  #
  # It earned itself on its first run.  1.88 — the corrected value, taken from
  # our own source — was *also* wrong, because egui/eframe 0.34 require 1.92, so
  # the declared floor still failed at dependency resolution.  Two wrong answers
  # in a row from careful reading, both caught here in five minutes: the floor is
  # a property of the whole dependency graph and cannot be read off our code.
  #
  # GATING, not advisory.  A wrong MSRV is not a flaky third-party peer — it is a
  # promise in Cargo.toml, the README and the user manual that the build breaks.
  #
  # `cargo check --all-targets`: type-check only — running the suite here would
  # gate the release on an old toolchain's *behaviour*, which is promised to
  # nobody — but over **every** target, tests included, not just the binary.
  #
  # `--all-targets` is deliberate and is the stricter of the two readings.  The
  # narrow one would match the README's promise exactly (a user runs
  # `cargo build --release` and never compiles a test), but CLAUDE.md documents
  # `cargo test` as part of this project's workflow, so a contributor who
  # installs the declared minimum must be able to run it.  Narrowing the check
  # to avoid a signal does not make the signal false, it just stops us seeing it.
  #
  # The cost of the stricter reading is that a **dev**-dependency raising its own
  # MSRV turns this job red over something no user ever compiles.  If that
  # happens, the fix is usually to pin the dev-dependency back — NOT to raise
  # `rust-version`, because that number is the promise in the README and the user
  # manual, and raising it turns away people whose toolchain builds the binary
  # perfectly well.  Only raise it when a *normal* dependency (or our own source)
  # is what needs the newer compiler.
  #
  # Margin as of 0.9.2: normal deps need 1.92 (egui/eframe), dev-deps need at
  # most 1.85 (proptest), so the tests are nowhere near being what sets the
  # floor.  `cargo metadata` reports both — see versionchange.txt.
  #
  # RUSTFLAGS is cleared deliberately.  The repo-wide `-D warnings` is a
  # *stable* gate; an older rustc lints differently, and a lint that 1.92 emits
  # and stable does not would fail this job for a reason unrelated to the floor.
  #
  # Keep the pin in step with Cargo.toml's `rust-version` — the point is that
  # they are the same number, so raising one without the other turns this job red.
  msrv:
    name: msrv (1.92)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # **Do not let a dependency bot move this SHA.**  `dtolnay/rust-toolchain`
      # publishes each toolchain as a version-named BRANCH, not a tag, so the
      # pin below is the head of `refs/heads/1.92.0` (commit message
      # "toolchain: 1.92.0").  The `# stable` pins elsewhere in this file are a
      # different commit in the same repository ("toolchain: stable").  Both
      # are legitimate; they install different compilers.
      #
      # Dependabot proposed exactly that swap in PR #17 (2026-09-07): it
      # offered to repoint this line at the *stable* commit while leaving the
      # `# 1.92.0` comment in place.  CI went green on the PR, because stable
      # builds the crate fine -- which is the whole hazard.  This job would
      # have installed the newest compiler, passed, and enforced nothing, and
      # the MSRV floor exists because it has drifted for real before (1.87 was
      # declared while the crate needed let-chains, and a reader of the README
      # found out first).
      #
      # If a bump to this line is ever wanted, resolve the branch head:
      #   gh api repos/dtolnay/rust-toolchain/git/matching-refs/heads/<version>
      # and confirm the commit message names that version, not "stable".
      - name: Install Rust 1.92 (the declared minimum)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.92.0

      # **This job passes just as well on the wrong compiler, so it says which
      # one it got.**  Installing a toolchain and running `cargo check` proves
      # the crate builds; it proves nothing about the FLOOR unless the compiler
      # is the floor.  Swap the pin above for the `stable` commit -- which is a
      # one-character-looking change a dependency bot has now proposed twice,
      # in PR #17 and PR #19 -- and every check here goes green while enforcing
      # nothing.  A guard that cannot go red is worse than no guard, because
      # the green tick is then a claim nobody re-checks.
      #
      # The expected version is read out of `Cargo.toml`, not written here:
      # `rust-version` is the declaration this job exists to enforce, and a
      # literal copy of it would agree with itself while both drifted from the
      # pin.  It matches on a prefix because `rust-version = "1.92"` is
      # satisfied by rustc `1.92.0` -- and a stable rustc, being newer, cannot
      # match a floor's prefix, which is the case being caught.
      - name: Verify the installed toolchain IS the declared minimum
        run: |
          want=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          got=$(rustc --version | awk '{print $2}')
          echo "Cargo.toml rust-version = ${want}; installed rustc = ${got}"
          case "${got}" in
            "${want}"|"${want}".*)
              echo "OK: this job is checking the declared floor." ;;
            *)
              echo "::error::The msrv job installed rustc ${got}, but the declared \
          minimum is ${want}. The toolchain pin in this job has been moved off \
          refs/heads/${want} -- most likely onto the 'stable' commit, which builds \
          fine and so enforces nothing. Resolve the branch head with: gh api \
          repos/dtolnay/rust-toolchain/git/matching-refs/heads/${want}"
              exit 1 ;;
          esac

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libfontconfig1-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo check (all targets)
        run: cargo check --all-targets --verbose

  # ─── Interop against real protocol peers (advisory) ───────────────────
  #
  # Runs the 25 `#[ignore]`d tests, which are excluded from `cargo test`
  # because they spawn real third-party peer binaries.  They are the only
  # SEND-path cover for XMODEM/YMODEM and the only ground truth that our
  # wire format matches somebody else's reader — the checked-in replay
  # fixtures lock the RECEIVE path, but a fixture can only ever confirm
  # what we recorded, so a send-side regression is invisible to it.
  #
  # ADVISORY (`continue-on-error`), deliberately: the peers arrive from the
  # Ubuntu archive and can be upgraded under us, so a distro bump must
  # surface as a red X to triage, never as a blocked merge.  The gating
  # jobs stay `test` / `licenses`.
  #
  # Unix-only by construction — every one of these tests is `#[cfg(unix)]`
  # (lrzsz and C-Kermit are Unix programs), so there is no Windows variant
  # to add here.
  interop:
    name: interop (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install build dependencies and protocol peers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudev-dev \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libfontconfig1-dev \
            lrzsz \
            ckermit

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Record which peer we actually tested against.  These tests assert
      # against another implementation's behaviour, so when this job goes
      # red the first question is always "did we regress, or did the peer
      # change?" — and that is unanswerable after the fact without this.
      # Validated locally against lrzsz 0.12.21rc and C-Kermit 10.0.416
      # Beta.12; Ubuntu noble ships C-Kermit 10.0 Beta.11.
      - name: Record peer versions
        run: |
          echo "--- lrzsz ---"
          for b in sx sb sz rx rb rz; do
            printf '%-4s ' "$b"; "$b" --version 2>&1 | head -1
          done
          echo "--- C-Kermit ---"
          kermit -V 2>&1 | head -3 || true

      # `--test-threads=1` because these tests spawn subprocesses, bind
      # sockets and mutate the shared on-disk `egateway.conf`; serial is
      # both deterministic and, at ~35 s for all 25, not worth
      # parallelising.  The debug profile is used on purpose — measured
      # identical to `--release` (34.9 s vs 34.1 s locally), so there is no
      # reason to pay for a second compile of the whole tree.
      #
      # Split by peer so one family failing still reports the other's
      # result; a single step would stop at the first failure and hide it.
      #
      # The three fixture *recorders* are `#[ignore]`d too and so run here,
      # but each self-skips unless its own env var is set (e.g.
      # ZMODEM_RECORD_FIXTURES) — that second gate exists precisely so a
      # bulk `--ignored` run like this one cannot silently rewrite the
      # committed fixtures.
      - name: lrzsz interop (XMODEM / XMODEM-1K / YMODEM / ZMODEM)
        continue-on-error: true
        run: cargo test --verbose -- --ignored --test-threads=1 --skip ckermit

      - name: C-Kermit interop (send, sliding-window, streaming, server)
        continue-on-error: true
        run: cargo test --verbose ckermit -- --ignored --test-threads=1

  rustfmt:
    name: rustfmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        continue-on-error: true  # advisory only; this repo doesn't enforce rustfmt style

  licenses:
    name: cargo deny (license policy)
    runs-on: ubuntu-latest
    # Enforces the GPL-3-compatible license allowlist in `deny.toml`.
    # Fails the build if a dependency carries a copyleft-incompatible
    # license (e.g. GPL-2.0-only, AGPL) or an unknown/unlicensed one,
    # so an incompatible crate can never land silently.  Unlike the
    # advisory `rustfmt`/`audit` jobs, this one GATES (no
    # continue-on-error): a license regression is a real problem.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check licenses

  audit:
    name: cargo audit (CVE scan)
    runs-on: ubuntu-latest
    # `rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2` creates a GitHub Check Run to summarise
    # advisories, which requires `checks: write`.  Without it the
    # action fails with "Resource not accessible by integration".
    # `contents: read` is the minimum needed by actions/checkout.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
    # Advisory: a transient advisory in an indirect dep shouldn't block
    # the whole CI.  The job still reports and surfaces a red X; use
    # `cargo audit` locally to triage before merge.
    continue-on-error: true
